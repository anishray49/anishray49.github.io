name: Verify Jekyll website

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - design/editorial-refresh-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build Jekyll
        run: bundle exec jekyll build --trace
      - name: Validate generated pages and styles
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/assets/css/main.css
          test -s _site/publications/index.html
          test -s _site/cv-json/index.html
          test -s _site/notes/index.html
          test -s _site/teaching/index.html
          grep -q 'class="teaching-hub"' _site/teaching/index.html
          test "$(grep -o 'class="teaching-entry"' _site/teaching/index.html | wc -l | tr -d ' ')" -eq 3
          grep -q 'MATH 2415' _site/teaching/index.html
          grep -q 'MATH 2305' _site/teaching/index.html
          grep -q 'MATH 2451' _site/teaching/index.html
          grep -q '>PGH-676</p>' _site/index.html
          grep -q 'class="author__location"' _site/index.html
          if grep -q 'Office: PGH' _site/index.html; then echo 'Office prefix still present'; exit 1; fi
          grep -q 'teaching-hub__timeline' _site/assets/css/main.css
          grep -q 'notes-hub' _site/notes/index.html
          if grep -q 'notes-hub__kicker' _site/notes/index.html; then echo 'Unwanted Writing/Seminars labels remain'; exit 1; fi
          grep -q '>Unpublished articles</h2>' _site/notes/index.html
          grep -q 'Talks &amp; lecture notes</h2>' _site/notes/index.html
          grep -q 'notes-hub__article-number' _site/notes/index.html
          if grep -q 'class="notes-hub__tag"' _site/notes/index.html; then echo 'Old research-project labels remain'; exit 1; fi
          grep -q 'notes-hub__list' _site/assets/css/main.css
          grep -q 'flex-direction:column' _site/assets/css/main.css
          test "$(grep -o 'class="notes-hub__note"' _site/notes/index.html | wc -l | tr -d ' ')" -eq 7
          if grep -q 'notes-hub__jump' _site/notes/index.html; then echo 'Removed Notes shortcuts still appear'; exit 1; fi
          grep -q 'Arithmetic statistics and Homogeneous dynamics' _site/index.html
          grep -q 'weighted-large-sieve.pdf' _site/notes/index.html
          grep -q 'lang-trotter-hardy-littlewood-cm.pdf' _site/notes/index.html
          if grep -q 'class="home-hero"' _site/index.html; then echo 'Unexpected green hero banner'; exit 1; fi
          grep -q 'home-intro' _site/index.html
          if grep -q 'home-outro' _site/index.html; then echo 'Removed homepage invitation still appears'; exit 1; fi
          if grep -Eqi '0[1-3] / (About|Research interests|ANALYSIS|AUTOMORPHIC FORMS|DYNAMICS)' _site/index.html; then echo 'Numbered homepage section labels remain'; exit 1; fi
          grep -q '>About</span>' _site/index.html
          grep -q '>Research interests</span>' _site/index.html
          grep -q 'home-research-grid' _site/assets/css/main.css
          grep -q 'publication-entry' _site/assets/css/main.css
